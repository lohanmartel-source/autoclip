# Construit l'installateur Windows à chaque tag v* (ex. v1.0.0) et le publie dans une Release GitHub.
name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../app/requirements.txt pyinstaller

      - name: Application (PyInstaller)
        run: pyinstaller --noconfirm --clean autoclip.spec

      - name: Test rapide de l'exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist/AutoClip/AutoClip.exe)) { throw "AutoClip.exe manquant" }
          if (-not (Test-Path dist/AutoClip/_internal/web/index.html)) { throw "page web manquante" }

      - name: FFmpeg
        shell: pwsh
        run: ./telecharger_ffmpeg.ps1

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-test" }
          & $iscc "/DVersion=$version" installateur.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClip-Setup
          path: build/sortie/*.exe

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/sortie/*.exe
          generate_release_notes: true
